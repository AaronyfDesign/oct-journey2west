let revLayers=[],fwdLayers=[];
function drawRev(){
 REV_SEQ.forEach((k,i)=>{
  const c=ROUTES[k];
  L.polyline(c,{color:'#fff',weight:8,opacity:.6}).addTo(map);
  const pl=L.polyline(c,{color:'#c2691f',weight:4.5,opacity:.95}).addTo(map);
  const a=document.createElement('div');
  pl.bindPopup(`<b>反向 · 第${i+1}程</b><br>${k}<br>方向：${k.replace('→',' → ')}`);
  revLayers.push(pl);
 });
}
function drawFwd(){
 FWD_SEQ.forEach((k,i)=>{
  const c=ROUTES[k].slice().reverse();
  L.polyline(c,{color:'#fff',weight:8,opacity:.4}).addTo(map);
  const pl=L.polyline(c,{color:'#2b7a5e',weight:4,opacity:.85,dashArray:'12,7'}).addTo(map);
  pl.bindPopup(`<b>正向 · 第${i+1}程</b><br>${k.replace('→',' ← ')}<br>与反向同一道路，方向相反`);
  fwdLayers.push(pl);
 });
 // 方向箭头装饰（decorator模拟：在每段中点放箭头marker）
 FWD_SEQ.forEach(k=>{
  const c=ROUTES[k];
  const mid=c[Math.floor(c.length/2)];
  const icon=L.divIcon({html:'<div style="color:#2b7a5e;font-size:15px;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff;">➤</div>',className:'arrow',iconSize:[16,16],iconAnchor:[8,8]});
  const m=L.marker([mid[0],mid[1]],{icon,interactive:false}).addTo(map);
  fwdLayers.push(m);
 });
}
function clearAll(){revLayers.forEach(l=>map.removeLayer(l));fwdLayers.forEach(l=>map.removeLayer(l));revLayers=[];fwdLayers=[];}

function addStays(){
 STAYS.forEach(s=>{
  const o=s.orig,f=s.fwd;
  const diff=Math.round(((o.low+o.high)/2)-((f.low+f.high)/2));
  const r=s.n==='西宁'?9:7.5;
  const m=L.circleMarker([s.lat,s.lon],{radius:r,color:'#fff',weight:2.5,
    fillColor:(o.peak||f.peak)?'#c0392b':((o.low+o.high)/2>(f.low+f.high)/2?'#2b7a5e':'#c2691f')),fillOpacity:1}).addTo(map);
  m.bindPopup(`<b>${s.n}</b>
   <div class="pp">
    <div class="row"><span class="lbl">🔄 反向</span><span class="rev">¥${o.low}${o.high<900?'-'+o.high:'+'}<span class="${o.peak?'peak':''}"> (${o.date}${o.peak?' 国庆':''})</span></span></div>
    <div class="row"><span class="lbl">🔃 正向</span><span class="fwd">¥${f.low}${f.high<900?'-'+f.high:'+'}<span class="${f.peak?'peak':''}"> (${f.date}${f.peak?' 国庆':''})</span></span></div>
    <div class="row"><span class="lbl">差额/间</span><span style="color:${diff>0?'#2b7a5e':'#c0392b'};font-weight:600">${diff>0?'正向省 ¥'+diff:(diff<0?'正向贵 ¥'+(-diff):'持平')}</span></div>
    ${o.note?`<div class="note">${o.note}</div>`:''}
    ${f.note?`<div class="note">${f.note}</div>`:''}
   </div>`);
  m.bindTooltip(s.n,{permanent:false,direction:'right',offset:[8,0]});
 });
}
function show(mode){
 ['both','rev','fwd'].forEach(k=>document.getElementById('btn-'+k).className=(k===mode)?'active':'inactive');
 clearAll();
 if(mode==='both'||mode==='rev')drawRev();
 if(mode==='both'||mode==='fwd')drawFwd();
}
drawRev();drawFwd();addStays();
const all=Object.values(ROUTES).flatMap(c=>c);
map.fitBounds(L.latLngBounds(all).pad(0.05));
document.getElementById('lgd').innerHTML=
 `<div><i style="background:#c2691f"></i>反向环线（逆时针 · 经典）</div>
  <div><i style="background:#2b7a5e"></i>正向环线（顺时针 · 省钱）</div>
  <div><i style="background:#c0392b"></i>涉及国庆正日住宿的站点</div>
  <div style="color:#888;font-size:11px;margin-top:4px">正向人均住宿省约 ¥900，全队 8 人省 ¥7000+</div>`;
window.__ready=1;
</script></body></html>
